<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffb916">
  <title>Website Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="maintenance">
    <section class="message" aria-labelledby="page-title">
      <h1 id="page-title">Website</h1>
      <p class="subtitle">under construction</p>
      <p class="description">We are preparing something amazing and exciting for you. Special surprise for our subscribers only.</p>
      <a class="notify" href="mailto:info@elim-rwanda.org?subject=Notify%20me%20when%20the%20website%20is%20back">Notify me</a>
      <p class="credit">We'll be back soon. Thank you for your patience.</p>
    </section>

    <div class="illustration">
      <svg viewBox="0 0 520 390" role="img" aria-labelledby="illustration-title">
        <title id="illustration-title">A construction sign, hard hat, and rolled plans</title>
        <defs>
          <linearGradient id="board" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f8c52b"/>
            <stop offset="1" stop-color="#e89b00"/>
          </linearGradient>
          <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#8f9697"/>
          </linearGradient>
          <linearGradient id="helmet" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#ff9a27"/>
            <stop offset="1" stop-color="#ed4b10"/>
          </linearGradient>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8a5700" flood-opacity=".35"/>
          </filter>
        </defs>
        <g filter="url(#shadow)">
          <path d="M170 90 84 179M170 90l140 91" fill="none" stroke="#747b7b" stroke-width="13" stroke-linecap="round"/>
          <path d="M170 90 84 179M170 90l140 91" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="170" cy="90" r="13" fill="#596061" stroke="#aeb4b4" stroke-width="4"/>
          <g transform="rotate(-4 251 202)">
            <rect x="50" y="160" width="395" height="135" rx="10" fill="#b97800"/>
            <rect x="57" y="166" width="380" height="120" rx="7" fill="url(#board)" stroke="#885900" stroke-width="3"/>
            <path d="M77 181h25l-11 9H66zm53 0h25l-11 9h-25zm53 0h25l-11 9h-25zm53 0h25l-11 9h-25zm53 0h25l-11 9h-25zm53 0h25l-11 9h-25zm53 0h25l-11 9h-25z" fill="#fff66b"/>
            <text x="247" y="232" text-anchor="middle" fill="#192528" font-family="Oswald, Arial, sans-serif" font-size="36" font-weight="600">UNDER</text>
            <text x="247" y="258" text-anchor="middle" fill="#192528" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">CONSTRUCTION</text>
          </g>
          <path d="M49 307h379" stroke="#777e7e" stroke-width="20" stroke-linecap="round"/>
          <path d="M54 301h369" stroke="url(#metal)" stroke-width="13" stroke-linecap="round"/>
          <path d="M78 311v17m322-17v17" stroke="#8c9292" stroke-width="8" stroke-linecap="round"/>
          <path d="M310 317h90a14 14 0 0 1 0 28h-90z" fill="#d9dddd" stroke="#858c8c" stroke-width="4"/>
          <ellipse cx="310" cy="331" rx="13" ry="14" fill="#aeb5b5" stroke="#7d8484" stroke-width="3"/>
          <ellipse cx="400" cy="331" rx="13" ry="14" fill="#f3f5f5" stroke="#858c8c" stroke-width="3"/>

    </div>
  </main>

</html>
